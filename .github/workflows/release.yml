name: Build and release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Check out version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate tag and package versions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const versions = ['chrome', 'firefox'].map(
            (t) => JSON.parse(readFileSync(`manifests/manifest.${t}.json`, 'utf8')).version,
          );
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${pkg.version}` || versions.some((v) => v !== pkg.version)) {
            throw new Error('Release tag, package.json and both manifest versions must match.');
          }
          JS
          git show-ref --verify "refs/tags/$RELEASE_TAG"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and check formatting
        run: |
          npm run lint
          npm run format:check

      - name: Build and package extension
        run: npm run package

      - name: Run complete test suite against production bundles
        run: npm test

      # AMO signs each version only once, so a rebuild reuses the signed .xpi already on the release.
      # Without the AMO secrets the release has no Firefox build (the unsigned one is not shipped).
      - name: Sign the Firefox add-on (AMO, unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          xpi="release/noleaker-firefox-$version.xpi"
          rm -f "$xpi"
          if gh release download "$RELEASE_TAG" --pattern "$(basename "$xpi")" --dir release 2>/dev/null; then
            echo "Reusing the signed $(basename "$xpi") from the release."
          elif [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            mkdir -p "$RUNNER_TEMP/sign"
            cp -R dist/firefox "$RUNNER_TEMP/sign/src"
            cp LICENSE THIRD_PARTY.md "$RUNNER_TEMP/sign/src/"
            git archive --format=zip -o "$RUNNER_TEMP/sign/source.zip" HEAD
            npx web-ext sign --channel=unlisted \
              --source-dir "$RUNNER_TEMP/sign/src" --artifacts-dir "$RUNNER_TEMP/sign/out" \
              --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
              --upload-source-code "$RUNNER_TEMP/sign/source.zip" --approval-timeout 1500000
            mv "$RUNNER_TEMP"/sign/out/*.xpi "$xpi"
          else
            echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set: this release has no Firefox build."
            exit 0
          fi
          node scripts/updates-json.mjs "$version" "$xpi" > release/updates.json

      - name: Create checksum
        run: |
          cd release
          sha256sum noleaker-*.zip $(ls noleaker-firefox-*.xpi updates.json 2>/dev/null) > SHA256SUMS.txt

      # Release notes: commits since the previous tag, grouped by conventional-commit type.
      - name: Write changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$RELEASE_TAG^" 2>/dev/null || true)
          commits=$(git log --no-merges --format='- %s (%h)' "${prev:+$prev..}$RELEASE_TAG" | grep -v '^- chore: release' || true)
          section() {
            lines=$(printf '%s\n' "$commits" | grep -E "$2" || true)
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section Features '^- feat'
            section Fixes '^- fix'
            other=$(printf '%s\n' "$commits" | grep -vE '^- (feat|fix)|^$' || true)
            if [ -n "$other" ]; then printf '## Other changes\n\n%s\n\n' "$other"; fi
            if [ -n "$prev" ]; then echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$RELEASE_TAG"; fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release assets with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(release/noleaker-*.zip release/SHA256SUMS.txt)
          [ -f release/updates.json ] && files+=(release/noleaker-firefox-*.xpi release/updates.json)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag --title "noleaker $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
